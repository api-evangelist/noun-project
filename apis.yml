features:
  - name: Icon Search
    description: >-
      Search nearly 10 million icons by query term, with optional filters for style (solid/line), line weight (1-60
      pixels at 512px rendering), public domain status, and thumbnail size.
  - name: Similar Icons
    description: >-
      Discover stylistically similar icons by providing a seed icon ID, enabling consistent visual language across a
      project.
  - name: Icon Download with Recoloring
    description: Download any icon in SVG or PNG format with a custom hexadecimal color and pixel size (20-1200 for PNG).
  - name: Collection Browsing
    description: Search and retrieve curated icon collections (icon sets) with full metadata and member icons.
  - name: Autocomplete
    description: Suggest search terms based on a query prefix, returning up to 10 matches.
  - name: Per-Client Blocklist
    description: >-
      Maintain a per-API-key blocklist of icon IDs, collection IDs, terms, and phrases to filter out unwanted content
      from search results. Blocklist is cached for 10 minutes.
  - name: Usage Telemetry
    description: Retrieve current API key usage against hourly, daily, and monthly limits via the /v2/client/usage endpoint.
useCases:
  - name: Icon Library Integration
    description: >-
      Embed Noun Project's visual language into a design tool, no-code builder, or web/mobile application so end users
      can pick from millions of icons without leaving the host product.
  - name: Branded Iconography
    description: >-
      Recolor icons to match brand palettes on the fly using the hex color parameter on the download endpoint,
      eliminating per-icon design work.
  - name: Style-Consistent Design Systems
    description: >-
      Use the more-like-this endpoint to source visually consistent icon sets from a single seed icon, accelerating
      design system curation.
  - name: Content Moderation
    description: >-
      Apply per-client blocklists to suppress icons that conflict with brand safety, regional, or audience-appropriate
      guidelines.
  - name: Educational and Reference Tools
    description: Pair the autocomplete and icon search endpoints to power glossary-style visual references and learning tools.
integrations:
  - name: OAuth 1.0a Client Libraries
    description: >-
      Compatible with any standards-compliant OAuth 1.0a library, including requests_oauthlib (Python), oauth1
      (Node.js), Faraday-OAuth (Ruby), DotNetOpenAuth (.NET), and Guzzle OAuth Subscriber (PHP).
  - name: Sketch
    description: >-
      The provider maintains Sketch plugin tooling (SketchPluginReloader) and historically distributed a Noun Project
      Sketch plugin.
  - name: Microsoft Office and Google Workspace
    description: Provider-distributed plugins for Microsoft 365 and Google Slides surface the same icon catalog backed by this API.
solutions:
  - name: Design Tool Vendors
    description: >-
      Power icon pickers, asset browsers, and template galleries inside design, presentation, and document-creation
      tools.
  - name: Marketing and Brand Teams
    description: On-demand recoloring of icons to enforce brand palettes across web, print, and presentation assets.
  - name: Education Platforms
    description: Add visual reference material to learning content with royalty-free, commercially-licensed icons.
  - name: No-Code and Low-Code Builders
    description: Expose a curated icon library to citizen developers building dashboards, portals, and forms.
