aid: noun-project
name: Noun Project
description: >-
  The Noun Project is a visual language platform providing access to nearly 10 million royalty-free PNG and SVG icons
  through an OAuth 1.0a-secured REST API. The v2 API supports icon search with style and line-weight filtering,
  similar-icon lookup, collection browsing, custom recoloring, autocomplete, per-client blocklists, and usage telemetry.
  Built on AWS, it serves more than 300 million requests per month at 99.99% uptime.
